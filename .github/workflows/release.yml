name: Build release zip

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Build zip
        run: |
          SLUG="${{ github.event.repository.name }}"   # or hard-code your plugin slug
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix="$SLUG/" -o "$SLUG-$VERSION.zip" HEAD
          echo "ZIP=$SLUG-$VERSION.zip" >> "$GITHUB_ENV"

      - name: Create release and attach zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --title "$GITHUB_REF_NAME" --generate-notes
